name: CI

on:
  push:
    branches: [main, master, public-release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install complete test environment
        run: python -m pip install -r requirements-test.txt
      - name: Tests without skips and independent exhaustive verification
        run: python scripts/check_project.py
      - name: Generate demo and public source
        run: |
          python run.py --industry 再生PP --data-mode demo
          python scripts/prepare_public_release.py
